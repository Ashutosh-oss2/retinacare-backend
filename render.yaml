services:
  - type: web
    name: retinacare-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}
    envVars:
      - key: PORT
        value: 8000
      - key: MODEL_WEIGHTS_DIR
        value: ./weights
      - key: KERAS_BACKEND
        value: torch
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:3000
      - key: ALLOW_ORIGIN_REGEX
        value: https://.*\.vercel\.app
    healthCheckPath: /health
    autoDeploy: true
